[package]
name = "codex-assistant"
version = "1.3.1"
description = "Codex Assistant - Local AI Proxy with WebView UI"
authors = ["muyun1314"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
